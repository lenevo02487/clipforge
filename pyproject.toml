[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.1.0"
description = "Turn long videos into platform-ready vertical Shorts/Reels. No AI, no API keys, no watermarks — just ffmpeg."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abhishek" }]
keywords = ["ffmpeg", "youtube-shorts", "reels", "video-clipping", "vertical-video", "cli"]

[project.scripts]
clipforge = "clipforge.cli:main"

[tool.setuptools.packages.find]
include = ["clipforge*"]
